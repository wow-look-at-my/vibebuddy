[package]
name = "vibebuddyd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
vibebuddy-protocol = { path = "../protocol" }
chrono.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
tokio-serial.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
base64 = "0.22"
crc32fast = "1"
ed25519-dalek = "2"
getrandom = "0.3"
libc = "0.2"
png = "0.17"
serialport = "4"
md-5 = "0.10"
tracing.workspace = true
tracing-subscriber.workspace = true
sha2 = "0.10"
# HTTPS for speech providers: ring rather than aws-lc (whose OpenSSL license the packaging allowlist doesn't take),
# and the system's certificate store, so a proxy whose CA the user trusts still works.
ureq = { version = "3", default-features = false, features = ["_ring", "rustls-no-provider", "platform-verifier"] }
mdns-sd = "0.21.5"
# Noise sessions with the box off the cable (noise_link.rs, ADR-0015): only what Noise_IK_25519_ChaChaPoly_SHA256 needs.
snow = { version = "0.10", default-features = false, features = ["std", "default-resolver", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }

# The box's ADPCM encoder for made Characters' lines (making.rs); in tests also the box's own side of the Noise
# handshake, so the tests check the two implementations against each other.
vibebuddy-firmware-core = { path = "../firmware-rs/core" }
# make-character.sh's names (a SHA-1 of the text) and its way of dropping a form of address, for made Characters.
regex.workspace = true
sha1 = "0.11"

[dev-dependencies]
http-body-util = "0.1"
tokio = { workspace = true, features = ["test-util"] }
