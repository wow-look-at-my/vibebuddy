# Apple-silicon DMG and x86_64 Linux tarball; a vX.Y.Z tag notarizes and publishes a GitHub Release, and release-firmware.yml releases the firmware.
name: release-app

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    branches: [main]
    paths:
      - "app/**"
      - "daemon/**"
      - "desktop/**"
      - "hook/**"
      - "protocol/**"
      - "firmware-rs/core/**"
      - "characters/**"
      - "fonts/**"
      - "tools/check-localization.py"
      - "tools/package-licenses.py"
      - "packaging/**"
      - "LICENSE"
      - "LICENSE-ASSETS"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release-app.yml"
  workflow_dispatch:

# Tag releases must not be cancelled by later pushes; consecutive pushes to main keep only the latest run.
concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  app:
    # macos-15 is an Apple-silicon runner, so the output is arm64; no Intel build yet.
    runs-on: macos-15
    env:
      # Developer ID signing and notarization need the secrets from tools/setup-release-signing.sh; without them the build is ad-hoc signed.
      SIGNED: ${{ secrets.MACOS_CERT_P12 != '' && secrets.APPLE_APP_PASSWORD != '' }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # build.rs and Info.plist both use git describe --tags for the build number, so tags must be visible.
          fetch-depth: 0
      - name: Determine version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "${RELEASE}" == "true" ]]; then
            # The tag is the version; if Cargo.toml hasn't caught up, stop rather than ship a package whose version lies.
            [[ "${GITHUB_REF_NAME}" == "v${version}" ]] || {
              echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2; exit 1; }
            label="${GITHUB_REF_NAME}"
          else
            label="$(git describe --tags --always)"
          fi
          echo "label=${label}" >> "${GITHUB_OUTPUT}"
      - name: Test
        run: |
          rustup update stable --no-self-update
          cargo test --workspace
          swift build --package-path app --product SelfTest
          "$(swift build --package-path app --show-bin-path)/SelfTest"
      - name: Import signing certificate
        if: env.SIGNED == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # The certificate goes into a temporary keychain that lives only in this job, with a random password; it dies with the runner.
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          echo "${MACOS_CERT_P12}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -P "${MACOS_CERT_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain}"
          rm "${RUNNER_TEMP}/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "${keychain_password}" "${keychain}" >/dev/null
          security list-keychains -d user -s "${keychain}" login.keychain
          identity="$(security find-identity -v -p codesigning "${keychain}" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          [[ -n "${identity}" ]] || { echo "no Developer ID Application certificate in the p12" >&2; exit 1; }
          echo "CODESIGN_IDENTITY=${identity}" >> "${GITHUB_ENV}"
      - name: Build app bundle
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          app/scripts/build-app.sh
          app/scripts/make-dmg.sh "VibeBuddy-${{ steps.version.outputs.label }}-arm64.dmg"
      - name: Notarize
        if: env.RELEASE == 'true' && env.SIGNED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg="VibeBuddy-${{ steps.version.outputs.label }}-arm64.dmg"
          codesign --force --timestamp --sign "${CODESIGN_IDENTITY}" "${dmg}"
          xcrun notarytool submit "${dmg}" --wait \
            --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" --password "${APPLE_APP_PASSWORD}"
          # A failed notarization fails stapling, retried while the ticket propagates, and Gatekeeper's own assessment confirms it.
          for attempt in 1 2 3 4 5; do
            xcrun stapler staple "${dmg}" && break
            [[ "${attempt}" -lt 5 ]] || exit 1
            echo "no ticket yet, retrying in 30 s"
            sleep 30
          done
          spctl --assess --type open --context context:primary-signature --verbose "${dmg}"
      # The publish job releases this, and it stays for a week either way for self-testing.
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: VibeBuddy-${{ steps.version.outputs.label }}-arm64.dmg
          retention-days: 7

  linux:
    # The oldest Ubuntu runner, so the binaries ask for an old glibc; Arch and Omarchy are far newer.
    runs-on: ubuntu-22.04
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The daemon's build ID uses git describe --tags, so tags must be visible.
          fetch-depth: 0
      - name: Determine version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "${RELEASE}" == "true" ]]; then
            [[ "${GITHUB_REF_NAME}" == "v${version}" ]] || {
              echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2; exit 1; }
            label="${GITHUB_REF_NAME}"
          else
            label="$(git describe --tags --always)"
          fi
          echo "label=${label}" >> "${GITHUB_OUTPUT}"
      - name: Install build dependencies
        # The serial port library reads USB IDs through libudev.
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Test
        run: |
          rustup update stable --no-self-update
          cargo test --workspace
          python3 tools/check-localization.py
      - name: Build package
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          packaging/linux/make-tarball.sh "${{ steps.version.outputs.label }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: VibeBuddy-${{ steps.version.outputs.label }}-linux-x86_64.tar.gz
          retention-days: 7

  publish:
    # One release for both platforms, made only once both packages exist.
    needs: [app, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      SIGNED: ${{ secrets.MACOS_CERT_P12 != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      # Only for docs/releases/<tag>.md, the hand-written part of the notes.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@v4
        with:
          name: mac
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          label="${GITHUB_REF_NAME}"
          # What the release does is written by hand before tagging; just release refuses to tag without it.
          summary="docs/releases/${label}.md"
          [[ -f "${summary}" ]] || { echo "missing ${summary}: say what this release does" >&2; exit 1; }
          { cat "${summary}"; printf '\n## Downloads\n\n'; } > notes.md
          cat >> notes.md <<NOTES
          - **macOS** (Apple silicon, macOS 14+): open the DMG and drag VibeBuddy into Applications.
          - **Linux** (x86_64, tested on Omarchy): \`tar xf VibeBuddy-${label}-linux-x86_64.tar.gz && cd VibeBuddy-${label}-linux-x86_64 && ./install.sh\`
          - **Firmware** comes in its own releases (\`firmware-v...\`); pick the zip with Settings -> Device -> Flash from file.
          NOTES
          if [[ "${SIGNED}" != "true" ]]; then
            cat >> notes.md <<'NOTES'

          The macOS build isn't notarized, so Gatekeeper blocks the first launch: allow it under System Settings → Privacy & Security, or run `xattr -dr com.apple.quarantine "/Applications/VibeBuddy.app"`.
          NOTES
          fi
          gh release create "${label}" --repo "${GITHUB_REPOSITORY}" \
            "VibeBuddy-${label}-arm64.dmg" \
            "VibeBuddy-${label}-linux-x86_64.tar.gz" \
            --title "VibeBuddy ${label}" \
            --notes-file notes.md
