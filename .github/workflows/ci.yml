# Checks every push: tests only, with no secrets, signing or uploads; release-firmware.yml builds the device firmware.
name: ci

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  rust:
    # The daemon, the Linux app, the hook, the protocol and the firmware's host-tested core.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        # The serial port library reads USB IDs through libudev.
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Toolchain
        run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        # Errors fail the check; existing warnings are reported, not fatal.
        run: cargo clippy --workspace --all-targets --locked
      - name: Localization
        # The Mac and Linux apps share the zh-Hans table; every UI string needs its translation.
        run: python3 tools/check-localization.py
      - name: Tool tests
        run: python3 -m unittest discover -s tools -p "test_*.py"

  mac-app:
    # The Mac app's model and status decoding, through its SelfTest; the app itself is built only for releases.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: SelfTest
        run: |
          swift build --package-path app --product SelfTest
          "$(swift build --package-path app --show-bin-path)/SelfTest"
